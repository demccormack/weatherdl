name: Build

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-releases:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-15-intel
            platform: macos-intel
          - os: macos-latest
            platform: macos-arm64
          - os: ubuntu-latest
            platform: ubuntu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows'
        run: uv sync --extra build --frozen

      - name: Build for Windows
        if: matrix.platform == 'windows'
        run: |
          uv run python -m PyInstaller -n weatherdl --onefile --add-data '.venv\Lib\site-packages\pptx\templates;pptx\templates' src\main.py

      - name: Copy config files (Windows)
        if: matrix.platform == 'windows'
        run: |
          Copy-Item config.json dist

      - name: Rename dist to weatherdl (Windows)
        if: matrix.platform == 'windows'
        run: |
          Rename-Item -Path dist -NewName weatherdl

      - name: Install dependencies (macOS/Ubuntu)
        if: matrix.platform != 'windows'
        run: uv sync --extra build --frozen

      - name: Build for macOS/Ubuntu
        if: matrix.platform != 'windows'
        run: |
          uv run python -m PyInstaller -n weatherdl --onefile --add-data ".venv/lib/python*/site-packages/pptx/templates:pptx/templates" src/main.py

      - name: Copy config files (macOS/Ubuntu)
        if: matrix.platform != 'windows'
        run: |
          cp config.json dist

      - name: Rename dist to weatherdl (macOS/Ubuntu)
        if: matrix.platform != 'windows'
        run: |
          mv dist weatherdl

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weatherdl-for-${{ matrix.platform }}
          path: weatherdl
