[project]
name = "weatherdl"
version = "v1.3.0"
description = "Weather download tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow==12.2.0",
    "xlsxwriter==3.2.9",
    "filetype==1.2.0",
    "python-pptx==1.0.2",
    "pytz==2026.1.post1",
    "requests==2.33.1",
    "lxml==6.1.0",
    "certifi==2026.2.25",
    "charset-normalizer==3.4.7",
    "idna==3.11",
    "urllib3==2.6.3",
]

[project.optional-dependencies]
dev = [
    "black==26.3.1",
    "pylint==4.0.5",
    "pytest==9.0.3",
    "isort==8.0.1",
    "autopep8==2.3.2",
]
build = [
    "pyinstaller==6.19.0",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = "src"

[tool.pylint.'tests/*.py']
disable = ["import-error", "missing-function-docstring", "missing-module-docstring"]
