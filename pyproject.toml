[project]
name = "weatherdl"
version = "v2.0.0"
description = "Weather download tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "filetype==1.2.0",
    "python-pptx==1.0.2",
    "pytz==2026.6",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "black==26.10.1",
    "pylint==4.0.9",
    "pytest==9.0.3",
    "isort==8.0.1",
    "autopep8==2.3.2",
]
build = [
    "pyinstaller==6.22.3",
]

[tool.uv]
required-version = ">=0.13.4"
no-build-package = ["lxml", "pillow"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = "src"

[tool.pylint.'tests/*.py']
disable = ["import-error", "missing-function-docstring", "missing-module-docstring"]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
]
